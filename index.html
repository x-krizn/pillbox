<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Pillbox</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.4;
            overflow: hidden;
            height: 100vh;
        }
        
        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
        }
        
        #output {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 10px;
        }
        
        #input-line {
            display: flex;
            align-items: center;
        }
        
        #prompt {
            color: #0ff;
            margin-right: 5px;
        }
        
        #input {
            flex: 1;
            background: transparent;
            border: none;
            color: #0f0;
            font-family: inherit;
            font-size: inherit;
            outline: none;
        }
        
        .error {
            color: #f00;
        }
        
        .warning {
            color: #ff0;
        }
        
        .success {
            color: #0f0;
        }
        
        .info {
            color: #0ff;
        }
        
        #editor-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            flex-direction: column;
            padding: 10px;
            z-index: 1000;
        }
        
        #editor-container.active {
            display: flex;
        }
        
        #editor-header {
            color: #0ff;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #0ff;
        }
        
        #editor-textarea {
            flex: 1;
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: inherit;
            font-size: inherit;
            padding: 10px;
            resize: none;
            outline: none;
        }
        
        #editor-footer {
            color: #0ff;
            margin-top: 10px;
            padding-top: 5px;
            border-top: 1px solid #0ff;
            font-size: 12px;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #000;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #0f0;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">></span>
            <input type="text" id="input" autocomplete="off" spellcheck="false">
        </div>
    </div>
    
    <div id="editor-container">
        <div id="editor-header">
            <span id="editor-filename"></span>
            <span style="float: right;">ESC: save and exit | CTRL+Q: exit without saving</span>
        </div>
        <textarea id="editor-textarea" spellcheck="false"></textarea>
        <div id="editor-footer">Lines: <span id="editor-lines">0</span> | Characters: <span id="editor-chars">0</span></div>
    </div>

    <script type="module">
        // ====================================================================
        // PILLBOX UI SHELL
        // All system logic is in modules - this is just UI binding
        // ====================================================================
        
        // Import core modules
        import VFS from './modules/vfs.js';
        import Shell from './modules/shell.js';
        import EditorModule from './modules/editor.js';
        import Terminal from './modules/terminal.js';
        import Kernel from './modules/kernel.js';
        import Commands from './modules/commands.js';
        import NetworkModule from './modules/network.js';
        
        class PillboxUI {
            constructor() {
                // DOM elements
                this.outputElement = document.getElementById('output');
                this.inputElement = document.getElementById('input');
                this.editorContainer = document.getElementById('editor-container');
                this.editorTextarea = document.getElementById('editor-textarea');
                this.editorFilename = document.getElementById('editor-filename');
                this.editorLines = document.getElementById('editor-lines');
                this.editorChars = document.getElementById('editor-chars');
                
                // Editor state
                this.currentEditFile = null;
                
                // Initialize system
                this.init();
            }
            
            async init() {
                // Create core module instances
                this.vfs = new VFS();
                this.shell = new Shell();
                this.editor = new EditorModule();
                this.terminal = new Terminal(this.outputElement, this.inputElement);
                this.kernel = new Kernel();
                this.network = new NetworkModule();
                
                // Boot kernel
                this.terminal.print('[BOOTING PILLBOX...]\n', 'info');
                
                const vfsInit = await this.vfs.init();
                if (vfsInit.warning) {
                    this.terminal.write(`[WARNING] ${vfsInit.warning}\n`, 'stdout', 'warning');
                }
                
                const bootResult = await this.kernel.boot({
                    terminal: this.terminal,
                    vfs: this.vfs,
                    shell: this.shell,
                    editor: this.editor,
                    network: this.network
                });
                
                // Initialize command system
                this.commands = new Commands(this.kernel, this.terminal, this.editor, this.shell);
                
                // Setup UI handlers
                this.setupInput();
                this.setupEditor();
                
                // Register service worker
                this.registerServiceWorker();
                
                // Display boot info
                this.terminal.print('\n[SYSTEM READY]\n', 'success');
                this.terminal.print(`Version: ${bootResult.version}\n`);
                this.terminal.print(`Storage: ${bootResult.storage}\n`);
                this.terminal.print(`Core modules: ${bootResult.modules}\n`);
                this.terminal.print(`User modules: ${bootResult.userModules}\n`);
                this.terminal.print('\nType "help" for commands\n', 'info');
                this.terminal.print('Try: cat file.txt | grep pattern | wc\n', 'info');
                this.terminal.print('     curl https://api.github.com/zen\n', 'info');
                this.terminal.print('     echo $HOME > output.txt\n\n', 'info');
                
                this.inputElement.focus();
            }
            
            setupInput() {
                this.inputElement.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const command = this.inputElement.value.trim();
                        if (command) {
                            this.terminal.handleInput(command);
                            this.shell.addHistory(command);
                            this.commands.execute(command);
                        }
                        this.inputElement.value = '';
                    } else {
                        this.terminal.handleKeyDown(e);
                    }
                });
            }
            
            setupEditor() {
                this.editorTextarea.addEventListener('input', () => {
                    const content = this.editorTextarea.value;
                    const lines = content.split('\n').length;
                    this.editorLines.textContent = lines;
                    this.editorChars.textContent = content.length;
                });
                
                this.editorTextarea.addEventListener('keydown', async (e) => {
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        await this.saveAndCloseEditor();
                    } else if (e.ctrlKey && e.key === 'q') {
                        e.preventDefault();
                        this.closeEditor();
                    }
                });
            }
            
            openEditor(filename, content) {
                this.currentEditFile = filename;
                this.editorFilename.textContent = filename;
                this.editorTextarea.value = content;
                this.editorContainer.classList.add('active');
                this.editorTextarea.focus();
                
                const lines = content.split('\n').length;
                this.editorLines.textContent = lines;
                this.editorChars.textContent = content.length;
            }
            
            async saveAndCloseEditor() {
                if (this.currentEditFile) {
                    const content = this.editorTextarea.value;
                    await this.kernel.saveFile(this.currentEditFile, content);
                    this.terminal.print(`[SAVED] ${this.currentEditFile}\n`, 'success');
                }
                this.closeEditor();
            }
            
            closeEditor() {
                this.editorContainer.classList.remove('active');
                this.currentEditFile = null;
                this.inputElement.focus();
            }
            
            registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then((registration) => {
                            console.log('[PWA] Service Worker registered:', registration.scope);
                        })
                        .catch((error) => {
                            console.log('[PWA] Service Worker registration failed:', error);
                        });
                }
            }
        }
        
        // Expose UI globally for commands to access
        window.PillboxUI = null;
        
        // Boot on load
        window.addEventListener('load', () => {
            window.PillboxUI = new PillboxUI();
        });
    </script>
</body>
</html>
